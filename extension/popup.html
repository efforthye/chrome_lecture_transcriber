<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Lecture Transcriber</h1>
    <span id="state" class="state">대기</span>
  </header>

  <details id="settings">
    <summary>키 설정</summary>
    <label>음성인식 서비스
      <select id="provider">
        <option value="groq">Groq (무료)</option>
        <option value="openai">OpenAI (유료, 분당 $0.006)</option>
      </select>
    </label>
    <div class="field"><span id="keyLabel">API 키</span> · <a id="keyLink" target="_blank">발급받기</a>
      <div id="keyList"></div>
      <button id="addKey" type="button" class="add">+ 키 추가</button>
    </div>
    <label>언어
      <select id="language">
        <option value="ko">한국어</option>
        <option value="en">영어</option>
        <option value="auto">자동 감지</option>
      </select>
    </label>
  </details>

  <label id="targetRow">영상이 있는 창
    <select id="target"></select>
  </label>
  <div class="actions" style="margin-top:8px">
    <button id="pick" class="primary">+ 강의 추가</button>
    <button id="pickStop" hidden>선택 취소</button>
  </div>
  <p id="hint" class="hint"></p>
  <p id="error" class="error" hidden></p>

  <div id="usage" class="usage" hidden></div>

  <div id="jobs" class="jobs"></div>

  <section id="previewBox" hidden>
    <div class="meta"><span id="title"></span><span id="count"></span><button id="copyPreview" type="button" class="mini">복사</button></div>
    <pre id="preview"></pre>
  </section>

  <details id="exportBox" class="export">
    <summary>내보내기 설정</summary>
    <label>형식
      <select id="format"></select>
    </label>
    <label class="check"><input type="checkbox" id="merge" /> 완료된 강의를 하나의 파일로 합치기</label>
    <p id="mergeNote" class="note" hidden>자막 형식(.srt/.vtt)은 강의마다 시간이 0부터 시작해서 합칠 수 없어요.</p>
    <label id="bundleRow" hidden>합친 파일 이름
      <input id="bundleName" placeholder="transcripts" autocomplete="off" />
    </label>
    <label class="check"><input type="checkbox" id="askWhere" /> 저장할 때마다 위치·이름 묻기</label>
  </details>

  <div class="actions">
    <button id="downloadAll" disabled>완료된 강의 모두 .txt 다운로드</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Lecture Transcriber</h1>
    <span id="state" class="state"></span>
  </header>

  <details id="settings">
    <summary data-i18n="keySettings"></summary>
    <label><span data-i18n="provider"></span>
      <select id="provider">
        <option value="groq" data-i18n="providerGroq"></option>
        <option value="openai" data-i18n="providerOpenai"></option>
      </select>
    </label>
    <div class="field"><span id="keyLabel"></span> · <a id="keyLink" target="_blank" data-i18n="getKey"></a>
      <div id="keyList"></div>
      <button id="addKey" type="button" class="add" data-i18n="addKey"></button>
    </div>
    <label><span data-i18n="audioLanguage"></span>
      <select id="language">
        <option value="ko" data-i18n="langKo"></option>
        <option value="en" data-i18n="langEn"></option>
        <option value="auto" data-i18n="langAuto"></option>
      </select>
    </label>
    <label><span data-i18n="uiLanguage"></span>
      <select id="uiLanguage"></select>
    </label>
  </details>

  <label id="targetRow"><span data-i18n="targetLabel"></span>
    <select id="target"></select>
  </label>
  <div class="actions" style="margin-top:8px">
    <button id="pick" class="primary" data-i18n="add"></button>
    <button id="pickStop" hidden data-i18n="cancelPick"></button>
  </div>
  <p id="hint" class="hint"></p>
  <p id="error" class="error" hidden></p>

  <div id="usage" class="usage" hidden></div>

  <div id="jobs" class="jobs"></div>

  <section id="previewBox" hidden>
    <div class="meta"><span id="title"></span><span id="count"></span><button id="copyPreview" type="button" class="mini" data-i18n="copy"></button></div>
    <pre id="preview"></pre>
  </section>

  <details id="exportBox" class="export">
    <summary data-i18n="exportSettings"></summary>
    <label><span data-i18n="format"></span>
      <select id="format"></select>
    </label>
    <label class="check"><input type="checkbox" id="merge" /> <span data-i18n="merge"></span></label>
    <p id="mergeNote" class="note" hidden data-i18n="mergeNote"></p>
    <label id="bundleRow" hidden><span data-i18n="bundleName"></span>
      <input id="bundleName" placeholder="transcripts" autocomplete="off" />
    </label>
    <label class="check"><input type="checkbox" id="askWhere" /> <span data-i18n="askWhere"></span></label>
  </details>

  <div class="actions">
    <button id="downloadAll" disabled></button>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
